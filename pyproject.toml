[project]
name = "slam-audit-agent"
version = "0.1.0"
description = "Portable evidence-grounded deletion audit agent"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lightgbm>=4.7,<5",
  "neo4j>=6.4,<7",
  "networkx>=3.5,<4",
  "numpy>=2.4,<3",
  "openai>=2.6,<3",
  "pandas>=3.1,<4",
  "pillow>=12,<13",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pypdf>=6,<7",
  "pytesseract>=0.3.13,<0.4",
  "uvicorn>=0.30,<1",
  "scikit-learn>=1.9,<2",
  "scipy>=1.17,<2",
]

[dependency-groups]
dev = [
  "hypothesis>=6.142,<7",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<0.15",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "code"
files = ["code/slam"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
